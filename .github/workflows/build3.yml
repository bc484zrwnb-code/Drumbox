name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o DrumBox.zip
      - name: Fix STL
        run: |
          sed -i 's|cppFlags += "-std=c++17"|cppFlags += "-std=c++17"; arguments += "-DANDROID_STL=c++_shared"|' DrumBox/app/build.gradle.kts
          grep -n "ANDROID_STL" DrumBox/app/build.gradle.kts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug --no-daemon
        working-directory: DrumBox
      - uses: actions/upload-artifact@v4
        with:
          name: DrumBox-apk
          path: DrumBox/app/build/outputs/apk/debug/app-debug.apk
